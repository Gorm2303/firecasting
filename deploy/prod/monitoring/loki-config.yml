auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
    # Loki 3.x: tsdb index is required for structured metadata
    - from: 2026-10-28
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  # Can be set to true once the tsdb period (2026-10-28) is active
  allow_structured_metadata: false
  retention_period: ${LOKI_RETENTION_DAYS}d
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

frontend:
  max_outstanding_per_tenant: 1024
